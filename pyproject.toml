[project]
name = "pebble-dbms"
version = "0.1.0"
description = "Minimal disk-oriented DBMS (V1), BusTub-inspired"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pebble"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
